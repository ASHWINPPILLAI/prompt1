# -------------------------------------------------------------------
# configs/default.yaml — single source of truth for all runtime settings.
# Every value here must trace to either a documented reason or an experiment.
# -------------------------------------------------------------------

llm:
  # Starting values; tuned in E4 (temperature/top_p sweep on dev set).
  generation:
    temperature: 0.2        # Factual QA: low temperature reduces hallucination
    top_p: 1.0              # Top-p sweep showed negligible effect at temp ≤ 0.3
    max_tokens: 600         # Covers 1-5 sentence answers + JSON envelope
  judge:
    temperature: 0.0        # Deterministic grading
    top_p: 1.0
    max_tokens: 200
  verifier:
    temperature: 0.0        # Deterministic claim checking
    top_p: 1.0
    max_tokens: 500
  react_step:
    temperature: 0.0        # Reproducible tool calls
    top_p: 1.0
    max_tokens: 300         # Per ReAct step cap
  autocot:
    temperature: 0.7        # Allow variety; filtered by quality checks
    top_p: 1.0
    max_tokens: 600
  timeout_s: 60
  max_retries: 5

retrieval:
  embedder: "sentence-transformers/all-MiniLM-L6-v2"
  chunk_tokens: 400         # Tuned in E5; covers most Doc2Dial sections
  overlap_tokens: 50        # Reduces boundary-cut retrieval errors
  top_k: 5                  # Tuned in E5

router:
  threshold: 0.60           # Below this → FALLBACK to V6 (set on val folds)
  cv_folds: 5
  cv_repeats: 5
  seeds: [1, 2, 3, 4, 5]   # One seed per repeat; deterministic

react:
  max_steps: 5
  tool_output_chars: 1200   # Truncate long tool outputs; logged when hit

data:
  seed: 42

# Tool-specific settings
tools:
  calculator:
    max_expression_len: 200  # Safety cap on ast-parsed expressions
    timeout_s: 2

# Cost table — fill from your provider's current pricing page.
# Units: USD per 1 million tokens.
pricing:
  input_per_million_tokens: null   # e.g. 0.15 for gpt-4o-mini input
  output_per_million_tokens: null  # e.g. 0.60 for gpt-4o-mini output
